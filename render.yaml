services:
  - type: web
    name: worldcup-economy-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FOOTBALL_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STOCK_TICKERS
        value: ADDYY,NKE,KO,BUD,V,BABA,FOX
      - key: POLLING_INTERVAL_LIVE
        value: 5
      - key: POLLING_INTERVAL_IDLE
        value: 30